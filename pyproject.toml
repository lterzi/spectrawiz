[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrawiz"
version = "0.1.0"
description = "Radar spectra explorer and simulator"
authors = [
    { name = "Leonie von Terzi" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.55.0",
    "xarray==2026.2.0",
    "matplotlib==3.10.8",
    "numpy==2.4.4",
    "pandas==2.3.3",
    "netcdf4==1.7.4",
    "scipy==1.17.1",
    "plotly==6.6.0",
    "astropy==8.0.0"
]

[project.scripts]
spectrawiz-process = "spectrawiz.process_data:main"

[tool.setuptools.packages.find]
where = ["src"]